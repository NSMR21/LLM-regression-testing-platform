[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regressionlens"
version = "0.1.0"
description = "Regression testing for LLM-powered features: repeated runs, paired statistics, flaky-test detection and CI verdicts."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "jinja2>=3.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "typer>=0.12",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]
dev = ["pytest>=8", "scipy>=1.13", "ruff>=0.5"]

[project.scripts]
rlens = "regressionlens.cli.main:app"

[tool.setuptools.packages.find]
include = ["regressionlens*"]

[tool.setuptools.package-data]
regressionlens = ["api/static/**/*", "db/migrations/**/*", "db/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
