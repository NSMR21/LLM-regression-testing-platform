name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rlens
          POSTGRES_PASSWORD: rlens
          POSTGRES_DB: regressionlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rlens" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[server,dev]"
      - run: ruff check regressionlens tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Server tests (Postgres)
        env:
          RLENS_TEST_DATABASE_URL: postgresql://rlens:rlens@localhost:5432/regressionlens_test
        run: pytest -q tests/test_server.py tests/test_queue.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
